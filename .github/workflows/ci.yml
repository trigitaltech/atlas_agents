name: Validate platform
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: atlas_test
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U atlas -d atlas_test' --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt
      - run: pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://atlas:test_only@localhost:5432/atlas_test' || '' }}
      - run: alembic upgrade head && alembic check
        working-directory: backend
        env:
          DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://atlas:test_only@localhost:5432/atlas_test' || 'sqlite:///./migration-test.db' }}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run build
        working-directory: frontend
